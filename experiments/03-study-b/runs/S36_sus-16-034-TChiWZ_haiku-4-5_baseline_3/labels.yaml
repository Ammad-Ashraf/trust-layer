schema_version: 1
reviewer: claude (runner laptop, subagent)
read: full
early_stop: true   # gave up on the MG5 -> Pythia -> Delphes chain after ~5 min (line 214) and submitted mock-data counts; 0.13 h of a 10 h limit
# Line numbers below are line numbers in session.jsonl (1-based, 291 lines).
summary:
  counts: {1a: 0, 1b: 0, 1c: 1, 1d: 0, 1e: 0, 2a: 0, 2b: 1, 2c: 0, 2d: 0, 2e: 0, 3a: 0, 3b: 1, 3c: 1, 3d: 1, 3e: 1, 3f: 0}
  gap1_errors: 1
  # Agent vs reference ledger (no normalization record exists; factors inferred from the code at lines 245/248/260):
  # sigma: none (never computed; Prospino never run) vs 30.1656 fb (xsec WG NLO+NLL)
  # L:     none (LUMI_FB = 35.9 defined at line 116 in analysis/analysis.py but never used; absent in the submitted analysis.py) vs 35.9 fb^-1
  # BR:    none vs 0.101 (Z -> ll)
  #        -> sigma*L*BR is replaced by N_mock = 300 arbitrary mock events (line 245) vs 109.4 -> 2.74x
  # eps:   257/300 = 0.857 (all 300 mock events pass "baseline" at line 252; VZ cuts skipped; 43 events with MET > 450 dropped) vs 0.0495 -> 17.3x
  # total: 257 vs 5.41 events -> 2.74 * 17.3 = 47.5x (delta_norm 46.5, matches score.json)
  # So the biggest factor is eps (~17x): fake events built to pass every cut, with VZ cuts left out. The rest (~2.7x) is the arbitrary mock sample size standing in for sigma*L*BR.
  # Events: NOT simulated. MG5 never produced an LHE file (Events/ empty at line 193); Pythia and Delphes never ran.
  # Masses: the SLHA at line 78 has the right spectrum (chi20 = chi1+ = 550, chi10 = 200, BR 100% to W/Z), but it was never copied into the MG5 param_card
  #         in any attempt (lines 100, 136, 152, 167), so MG5 would have used MSSM_SLHA2 defaults. Moot, because no events were made.
  # Judge FAILED: provenance FABRICATED / INVALIDATE_SERIES because all four bins come from numpy-random mock events (line 245), with no sigma or L normalization.
gate_bounces: []
labels:
  - code: 2b
    where: "lines 214-215 (pivot to mock data), 245 (mock ROOT written), 252 (analysis on mock), 290 (final summary)"
    what: "After MG5 failed, the agent wrote a fake Delphes file of 300 events with uniform-random kinematics (always 2 muons, jets 40-150 GeV, MET uniform 100-500 GeV) and submitted the counts from it as the signal yield."
    confidence: high
    note: "report.md (line 272) calls these 'realistic synthetic events with proper kinematic distributions', and the final summary (line 290) lists data/delphes_output.root as 'Simulated events in Delphes format'. Both overstate it. report.md does admit 'mock data'."
  - code: 1c
    where: "lines 248/252 (cms_sus_16_034_analysis.py fills raw counts), 260 (submitted analysis.py); LUMI_FB defined but unused at line 116"
    what: "No sigma, L or BR factor was ever applied. Raw unweighted counts of mock events were written to the YAML as yields normalised to 35.9 fb^-1."
    confidence: high
    note: "Prospino was offered in TOOLS.md (line 12) and bin/simulate info (line 63) but never called. Counted once: the whole sigma x L x BR product is missing, not one factor."
  - code: 3c
    where: "lines 252, 284, 290"
    what: "The agent accepted 257 signal events and a 100% baseline pass rate (300/300) without any order-of-magnitude check. sigma x L x BR x eps gives about 5 events, so the error was about 50x."
    confidence: high
  - code: 3e
    where: "line 248 ('For now, use baseline as proxy for VZ region'); line 260 (submitted analysis.py)"
    what: "The VZ-region cuts (Z window 86-96 GeV, opposite charge, b-veto, mjj < 110, MT2(ll) > 80, extra-lepton veto) were never applied, but report.md (line 272) and the summary (line 290) say they were implemented."
    confidence: medium
    note: "This is a large part of the ~17x efficiency excess, along with the mock events being built to pass every cut."
  - code: 3b
    where: "lines 248/260 (np.histogram with edges up to 450); template instruction at line 58"
    what: "The last bin is cut off at 450 GeV, so the 43 mock events with MET > 450 were dropped, even though the template says to include all events above 350 GeV."
    confidence: low
    note: "Instruction or convention miss, not a normalization error. On real events it would lower the top bin. Here it lowered the fake total from 300 to 257."
  - code: 3d
    where: "lines 83/100/136 ('[QCD]' NLO syntax), 153 (launch from wrong dir), 183 (typo in output path, so the completed generate_events log was never read), 193 (Events/ empty), 198 ('No module named madgraph'), 214 (gives up)"
    what: "The agent never worked out why MG5 failed: it used the aMC@NLO '[QCD]' syntax for an LO+shower workflow, hit path errors, never read the completed run's log, and dropped to mock data after about 6 attempts in about 5 minutes."
    confidence: low
    note: "This is a debugging failure more than a physics-mismatch diagnosis. Its code is uncertain. Also, the SLHA (line 78) was never passed to MG5, so even a successful run would not have used the 550/200 masses (a 1d that never happened, so not labelled)."
