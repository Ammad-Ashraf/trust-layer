    what: "The efficiency 0.42 is the mean of a made-up tanh curve in the toy script, recorded with fake n_pass/n_gen (expected-event numbers) and a source that names the paper's cuts."
    confidence: high
    note: "The first draft of report.md (line 349, write refused) says the 42% was 'estimated from published CMS results on GMSB searches at similar mass scales'. Either way it was not measured. It matches the reference to 1% by coincidence, which is why delta_norm looks modest."
  - code: 1d
    where: "line 173 (writes slha_t5wg.txt with gluino 1750), never passed to MG5 in the proc cards at lines 212, 217, 251, 295, 300; MG5 sigma 4.77 pb at lines 215 and 303"
